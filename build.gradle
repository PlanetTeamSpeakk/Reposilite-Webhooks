plugins {
    id 'java'
    id("io.freefair.lombok") version "9.5.0"
    id("com.gradleup.shadow") version "9.2.2"
}

group = 'com.ptsmods'
version = pluginVersion

def generatedSrcDir = layout.buildDirectory.dir('generated/sources/buildconfig/main/java')

tasks.register('generateBuildConfig') {
    inputs.property('pluginVersion', pluginVersion)
    outputs.dir(generatedSrcDir)
    doLast {
        def file = generatedSrcDir.get().file('com/ptsmods/repwh/BuildVersion.java').asFile
        file.parentFile.mkdirs()
        file.text = """\
package com.ptsmods.repwh;

public final class BuildVersion {
    public static final String VERSION = "${pluginVersion}";
    private BuildVersion() {}
}
"""
    }
}

compileJava.dependsOn generateBuildConfig
sourceSets.main.java.srcDir generatedSrcDir

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.reposilite.com/releases'
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'com.reposilite:reposilite:3.5.28'

    // Gson is used throughout the plugin. Reposilite no longer provides it on the
    // runtime classpath, so it must be bundled into the plugin jar (see shadowJar).
    implementation 'com.google.code.gson:gson:2.11.0'
}

test {
    useJUnitPlatform()
}

// The published artifact must be a fat jar containing (a relocated copy of) Gson,
// since Reposilite does not expose it to plugins at runtime. Relocation keeps our
// bundled Gson from clashing with any other copy on the shared plugin classloader.
shadowJar {
    archiveClassifier = ''
    relocate 'com.google.gson', 'com.ptsmods.repwh.libs.gson'
}

// Disable the thin jar so only the shaded jar carries the canonical artifact name.
jar {
    enabled = false
}

assemble.dependsOn shadowJar