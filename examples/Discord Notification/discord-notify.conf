[discord]
webhook_url = https://discord.com/api/webhooks/REPLACE_WITH_YOUR_WEBHOOK_ID/REPLACE_WITH_YOUR_WEBHOOK_TOKEN
username    = Maven Updates
avatar_url  = https://reposilite.com/images/favicon.png

; Available placeholders: {artifact}, {version}, {filename}, {by},
;                         {download_url}, {compare_url}, {compare_range}
; Use \n for newlines.
; Discord markdown tip: [{compare_range}]({compare_url}) renders as a labelled hyperlink.
message = 🧪 New build available: **{artifact}** `{version}`\nChangelog: [{compare_range}]({compare_url})\nDownload: [filename]({download_url})

[reposilite]
base_url = https://maven.example.com

[github]
repo = JCraft-EoE/jcraft-eoe

; A fine-grained PAT with the "Contents: read" permission.
; Optional for public repos, but recommended to raise the rate limit from 60 to 5 000 req/h.
; Leave blank to use unauthenticated access.
token =
